# Funding Director — production-shaped copy of the live Single Brain runtime.
# All per-owner values come from the private .env generated by setup.sh.

services:
  hermes:
    image: funding-director-hermes:0.21.0-reviewed
    build:
      context: .
      dockerfile: hermes-image/Dockerfile
    container_name: ${AGENT_NAME:-funding-director}
    restart: unless-stopped
    # Hermes uses s6-overlay and must own PID 1.
    init: false
    stdin_open: true
    tty: true
    dns:
      - 8.8.8.8
      - 8.8.4.4
    environment:
      TZ: ${TZ:-America/New_York}
      HOME: /opt/data
      HERMES_TUI_DIR: /opt/hermes/ui-tui
      HERMES_ACCEPT_HOOKS: "0"

      # Inference
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?OPENROUTER_API_KEY is required}
      FIREWORKS_API_KEY: ${FIREWORKS_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      TOGETHER_API_KEY: ${TOGETHER_API_KEY:-}

      # Messaging channels
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      SLACK_APP_TOKEN: ${SLACK_APP_TOKEN:-}
      SLACK_ALLOWED_USERS: ${SLACK_ALLOWED_USERS:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      BLUEBUBBLES_SERVER_URL: ${BLUEBUBBLES_SERVER_URL:-}
      BLUEBUBBLES_PASSWORD: ${BLUEBUBBLES_PASSWORD:-}
      GATEWAY_ALLOW_ALL_USERS: ${GATEWAY_ALLOW_ALL_USERS:-false}

      # Business tools
      COMPOSIO_API_KEY: ${COMPOSIO_API_KEY:-}
      FUNDING_MACHINE_API_KEY: ${FUNDING_MACHINE_API_KEY:-}
      GHL_API_KEY: ${GHL_API_KEY:-}
      GHL_LOCATION_ID: ${GHL_LOCATION_ID:-}
      BROWSER_USE_API_KEY: ${BROWSER_USE_API_KEY:-}
      BROWSERBASE_API_KEY: ${BROWSERBASE_API_KEY:-}
      BROWSERBASE_PROJECT_ID: ${BROWSERBASE_PROJECT_ID:-}
      BROWSERBASE_CONTEXT_ID: ${BROWSERBASE_CONTEXT_ID:-}
      HYPERBROWSER_API_KEY: ${HYPERBROWSER_API_KEY:-}
      AIRTOP_API_KEY: ${AIRTOP_API_KEY:-}
      STEEL_API_KEY: ${STEEL_API_KEY:-}
      ORGO_API_KEY: ${ORGO_API_KEY:-}
      ORGO_COMPUTER_ID: ${ORGO_COMPUTER_ID:-}
      BROWSERLESS_TOKEN: ${BROWSERLESS_TOKEN:-}
      BROWSERLESS_BASE_URL: ${BROWSERLESS_BASE_URL:-}
      DECODO_PROXY: ${DECODO_PROXY:-}
      RTRVR_API_KEY: ${RTRVR_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      APIFY_API_KEY: ${APIFY_API_KEY:-}
      INSTANTLY_API_KEY: ${INSTANTLY_API_KEY:-}
      SMARTLEAD_API_KEY: ${SMARTLEAD_API_KEY:-}
      CALCOM_API_KEY: ${CALCOM_API_KEY:-}
      RETELL_API_KEY: ${RETELL_API_KEY:-}
      CONVERTKIT_API_KEY: ${CONVERTKIT_API_KEY:-}
      JANGOMAIL_USERNAME: ${JANGOMAIL_USERNAME:-}
      JANGOMAIL_PASSWORD: ${JANGOMAIL_PASSWORD:-}
      REACHER_CONSUMER_KEY: ${REACHER_CONSUMER_KEY:-}
      SUPER_BROWSER_REPO_ROOT: /opt/super-browser
      PLAYWRIGHT_BROWSERS_PATH: /opt/playwright

    volumes:
      # Never remove this bind mount: it is the operator's durable memory.
      - ${BASE_DIR:-/srv/funding-director}/hermes/data:/opt/data
      - ${BASE_DIR:-/srv/funding-director}/vault:/vault
      - ${BASE_DIR:-/srv/funding-director}/logs:/logs
      - ${BASE_DIR:-/srv/funding-director}/funding-director:/opt/funding-director-data
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${BASE_DIR:-/srv/funding-director}/bin/start-hermes.sh:/start-hermes.sh:ro
      - ${BASE_DIR:-/srv/funding-director}/bin/init-chown.sh:/init-chown.sh:ro
    ports:
      # Private by default. Use an SSH tunnel or Tailscale to open the dashboard.
      - "127.0.0.1:${HERMES_PORT:-18789}:9119"
    networks: [agent_net]
    mem_limit: ${HERMES_MEM_LIMIT:-5g}
    cpus: "${HERMES_CPUS:-3.0}"
    security_opt: ["no-new-privileges:true"]
    entrypoint: ["/init-chown.sh"]
    command: ["/bin/bash", "/start-hermes.sh"]
    healthcheck:
      test: ["CMD", "/opt/hermes/.venv/bin/hermes", "gateway", "status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  # Optional second copy of memory: Obsidian markdown plus Notion.
  sync:
    build: ./sync
    container_name: ${AGENT_NAME:-funding-director}-sync
    profiles: ["sync"]
    restart: unless-stopped
    init: true
    depends_on:
      hermes:
        condition: service_started
    environment:
      TZ: ${TZ:-America/New_York}
      NOTION_TOKEN: ${NOTION_TOKEN:-}
      NOTION_DB_SESSIONS: ${NOTION_DB_SESSIONS:-}
      NOTION_DB_KANBAN_TASKS: ${NOTION_DB_KANBAN_TASKS:-}
      NOTION_DB_MEMORIES: ${NOTION_DB_MEMORIES:-}
      NOTION_DB_SKILLS: ${NOTION_DB_SKILLS:-}
      NOTION_DB_EVENTS: ${NOTION_DB_EVENTS:-}
      SYNC_INTERVAL_SECONDS: ${SYNC_INTERVAL_SECONDS:-60}
    volumes:
      - ${BASE_DIR:-/srv/funding-director}/hermes/data:/opt/data:ro
      - ${BASE_DIR:-/srv/funding-director}/vault:/vault
    networks: [agent_net]
    mem_limit: 256m
    cpus: "0.5"
    security_opt: ["no-new-privileges:true"]

networks:
  agent_net:
    driver: bridge
    name: ${AGENT_NAME:-funding-director}-net
